<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chart your budget</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body class="bg-body-tertiary">
        <main class="container py-4">
            <header class="d-flex align-items-start justify-content-between gap-3 mb-2">
                <h1 class="h3 d-flex align-items-center gap-2 budget-title mb-0">
                    <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/chart-no-axes-combined.svg"
                        alt="" width="28" height="28" class="flex-shrink-0">
                    <span>Chart your budget</span>
                </h1>
                <div class="dropdown flex-shrink-0">
                    <button type="button" class="btn btn-primary d-flex align-items-center gap-2" id="account-toggle"
                        data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
                        aria-controls="username-form">
                        <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/user-round.svg"
                            alt="" width="20" height="20" class="download-icon flex-shrink-0">
                        <span id="account-name" class="account-name">Log in</span>
                    </button>
                    <form id="username-form" class="dropdown-menu dropdown-menu-end p-3 account-menu" novalidate
                        aria-labelledby="account-toggle">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username"
                            required minlength="5" pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s]).{5,}"
                            aria-describedby="username-error" aria-invalid="false">
                        <div id="username-error" class="invalid-feedback" role="status" hidden></div>
                        <button type="submit" class="btn btn-primary mt-3" id="submit-username">Log in</button>
                    </form>
                </div>
            </header>
            <p class="text-secondary">Enter your monthly income and expenses in USD, then view them on the Chart tab.</p>

            <ul class="nav nav-tabs" id="budget-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data-pane"
                        type="button" role="tab" aria-controls="data-pane" aria-selected="true">Data</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart-pane"
                        type="button" role="tab" aria-controls="chart-pane" aria-selected="false">Chart</button>
                </li>
            </ul>

            <div class="tab-content bg-body border border-top-0 rounded-bottom p-3">
                <div class="tab-pane fade show active" id="data-pane" role="tabpanel" aria-labelledby="data-tab" tabindex="0">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th scope="col">Month</th>
                                    <th scope="col">Income (USD)</th>
                                    <th scope="col">Expenses (USD)</th>
                                </tr>
                            </thead>
                            <tbody id="budget-rows"></tbody>
                            <tfoot class="table-group-divider fw-semibold">
                                <tr>
                                    <th scope="row">Total</th>
                                    <td id="total-income">$0.00</td>
                                    <td id="total-expenses">$0.00</td>
                                </tr>
                                <tr>
                                    <th scope="row">Net</th>
                                    <td colspan="2" id="total-net">$0.00</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <button type="button" class="btn btn-primary mt-3" id="generate-data">Generate example data</button>
                    <button type="button" class="btn btn-outline-secondary mt-3" id="clear-data" hidden>Clear data</button>
                </div>

                <div class="tab-pane fade" id="chart-pane" role="tabpanel" aria-labelledby="chart-tab" tabindex="0">
                    <div class="chart-display">
                        <button type="button" class="btn btn-primary mb-3" id="download-chart" title="Download chart" hidden>
                            <img src="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/download.svg"
                                alt="" width="20" height="20" class="download-icon me-1">
                            Download
                        </button>
                        <div id="chart-empty" class="alert alert-info mb-0" role="status">
                            No budget data yet.
                        </div>
                        <div id="chart-container" class="position-relative" hidden>
                            <canvas id="budget-chart" role="img" aria-label="Monthly income and expenses bar chart"></canvas>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary mt-3" id="generate-chart-data">Generate example data</button>
                    <button type="button" class="btn btn-outline-secondary mt-3" id="clear-chart-data" hidden>Clear data</button>
                </div>
            </div>
        </main>

        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="username-success" class="toast text-bg-success border-0" role="status"
                aria-live="polite" aria-atomic="true" data-bs-delay="5000">
                <div class="toast-body">Username submitted successfully.</div>
            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"
            integrity="sha384-G436+Z2nlA8+PNoeRvWdxKbvOf8E/y+lYxqht2iBwNHTQDV5CJr3+AGVj8fGZi5t"
            crossorigin="anonymous"></script>
        <script src="script.js"></script>
    </body>
</html>
